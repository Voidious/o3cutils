[project]
name = "o3cutils"
version = "0.1.0"
description = "Python utilities for controlling the SayoDevice O3C macro keyboard's screen and LEDs."
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
addopts = "--cov=main --cov-branch --cov-fail-under=100"
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]

[tool.uv.sources]
crispen = { git = "https://github.com/Voidious/crispen" }

[dependency-groups]
dev = [
    "crispen",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
